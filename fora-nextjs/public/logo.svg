<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120">
  <!--
    ФОРА — Corner Profile
    Векторный логотип, чистый SVG без растровых вставок.
    Знак слева — стилизованный угловой соединительный элемент (С-образная форма).
    Wordmark справа — ФОРА + подпись.
    Цвета: #1a2e4a (navy), #0056b3 (blue), #6c757d (gray subtitle)
  -->

  <!-- ════════════ ICON MARK ════════════ -->

  <!-- Фон знака: тёмно-синий скруглённый квадрат -->
  <rect x="0" y="0" width="120" height="120" rx="16" fill="#1a2e4a"/>

  <!-- С-образный символ (угловой профиль в разрезе): три белые полосы -->
  <!-- Верхняя горизонтальная полоса -->
  <rect x="18" y="18" width="76" height="22" rx="5" fill="#ffffff"/>
  <!-- Левая вертикальная полоса -->
  <rect x="18" y="18" width="22" height="84" rx="5" fill="#ffffff"/>
  <!-- Нижняя горизонтальная полоса -->
  <rect x="18" y="80" width="76" height="22" rx="5" fill="#ffffff"/>

  <!-- Акцентный квадрат (скругление профиля) — синий, в правом нижнем углу белого пространства -->
  <rect x="54" y="46" width="30" height="30" rx="6" fill="#0056b3"/>

  <!-- ════════════ WORDMARK ════════════ -->

  <!-- Название компании -->
  <text
    x="152"
    y="74"
    font-family="'Montserrat','Inter','Segoe UI','Arial Black',sans-serif"
    font-weight="800"
    font-size="54"
    fill="#1a2e4a"
  >ФОРА</text>

  <!-- Разделительная линия под названием -->
  <rect x="152" y="83" width="316" height="2" rx="1" fill="#0056b3"/>

  <!-- Подпись -->
  <text
    x="154"
    y="103"
    font-family="'Montserrat','Inter','Segoe UI','Arial',sans-serif"
    font-weight="400"
    font-size="13"
    fill="#6c757d"
  >СОЕДИНИТЕЛЬНЫЕ ЭЛЕМЕНТЫ</text>

</svg>
